<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>404-페이지를 찾을 수 없어요 | 조밈 시참 설명서</title>
<link rel="icon" href="https://jomeme.kro.kr/jome.e.png" type="image/png">
<style>
:root {
  --bg: #ffffff;
  --bg2: #f7f7f5;
  --text: #111111;
  --text2: #444440;
  --text3: #7a7a72;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.15);
  --accent: #d4793a;
  --accent-bg: #fdf3e7;
  --accent-text: #7c3e0e;
  --nav-bg: rgba(255,255,255,0.55);
  --glass-surface: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.32));
  --glass-border: rgba(0,0,0,0.09);
  --glass-shadow: 0 18px 40px rgba(0,0,0,.08);
  --glass-inset: inset 0 1px rgba(255,255,255,.7);
  --glass-hover: rgba(0,0,0,0.03);
  --toggle-bg: rgba(120,120,120,0.14);
  --toggle-border: rgba(0,0,0,0.14);
  --toggle-glint: rgba(255,255,255,0.9);
  --ease-apple: cubic-bezier(0.32,0.72,0,1);
  --ease-apple-press: cubic-bezier(0.2,0.8,0.2,1);
}
@media (prefers-color-scheme: dark) {
:root {
  --bg: #000000;
  --bg2: #0d0d0d;
  --text: #e3e3de;
  --text2: #c0c0b8;
  --text3: #909088;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.16);
  --accent: #e8954a;
  --accent-bg: #3a1e06;
  --accent-text: #f0b070;
  --nav-bg: rgba(20,20,20,0.55);
  --glass-surface: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
  --glass-border: rgba(255,255,255,0.14);
  --glass-shadow: 0 18px 40px rgba(0,0,0,.55);
  --glass-inset: inset 0 1px rgba(255,255,255,.12);
  --glass-hover: rgba(255,255,255,0.05);
  --toggle-bg: rgba(255,255,255,0.10);
  --toggle-border: rgba(255,255,255,0.2);
  --toggle-glint: rgba(255,255,255,0.7);
}
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; line-height: 1.7;
  min-height: 100vh; min-height: 100svh;
  transition: background .25s, color .25s;
  overflow-x: hidden;
}

/* ── 본문 ── */
main {
  max-width: 880px; margin: 0 auto;
  padding: 48px 24px 72px;
  min-height: 100vh; min-height: 100svh; justify-content: center;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}

.art-card {
  width: min(680px, 100%);
  padding: 10px;
  border-radius: 28px;
  border: 1px solid var(--glass-border);
  background: var(--glass-surface);
  backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow: var(--glass-shadow), var(--glass-inset);
}
.art-card img { display: block; width: 100%; height: auto; border-radius: 20px; }

.card-body { padding: 26px 20px 20px; }

.err-code {
  display: inline-block;
  padding: 3px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700;
  background: var(--accent-bg); color: var(--accent-text);
  border: 1px solid rgba(212,121,58,.22);
}
h1 { margin-top: 12px; font-size: 28px; font-weight: 800; letter-spacing: -.5px; line-height: 1.25; word-break: keep-all; }
.desc { margin-top: 8px; color: var(--text2); font-size: 15px; word-break: keep-all; }

.actions {
  margin: 24px auto 0; max-width: 320px;
  display: flex; flex-direction: column; gap: 10px;
}

.pill {
  display: inline-flex; align-items: center; justify-content: center;
  height: 48px; padding: 0 18px; border-radius: 999px;
  font: inherit; font-size: 14.5px; font-weight: 700;
  text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: transform .18s var(--ease-apple-press), box-shadow .15s, background .15s, color .15s;
}
.pill:hover { transform: scale(1.03); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
.pill:active { transform: scale(.96); }
.pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.pill-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
.pill-ghost { background: var(--bg2); color: var(--text2); border: 1px solid var(--border2); }
.pill-ghost:hover { color: var(--text); }

@media (max-width: 480px) {
  main { padding: 24px 14px 48px; }
  .card-body { padding: 22px 8px 12px; }
  h1 { font-size: 24px; }
  .actions { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<main>
  <div class="art-card">
    <img src="https://jomeme.kro.kr/404im.png" alt="40이미지">

    <div class="card-body">
      <span class="err-code">404 Not Found</span>
      <h1>페이지를 찾을 수 없어요</h1>
      <p class="desc">주소가 잘못되었거나 삭제된 페이지예요.</p>

      <div class="actions">
        <a class="pill pill-primary" href="https://jomeme.kro.kr">홈으로 가기</a>
        <button class="pill pill-ghost" type="button" id="back">이전 페이지로</button>
      </div>
    </div>
  </div>
</main>

<script>
document.getElementById('back').addEventListener('click', function () {
  history.length > 1 ? history.back() : (location.href = 'https://jomeme.kro.kr');
});
</script>
</body>
</html>
