<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.dataset.theme=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";</script>
<meta name="color-scheme" content="light">
<title>조밈님의 생일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>
  :root{
    --cream:#fff8e9;
    --paper:#fdf6e3;
    --sky:#bfe6e8;
    --coral:#ff6b5e;
    --coral-dark:#e5473a;
    --yolk:#ffbf3f;
    --ink:#3a3226;
    --violet:#8c7ae6;
    --green:#4caf7d;
    --gate-start:#fff2cf;--gate-end:#bfe6e8;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="dark"]{--cream:#191a24;--paper:#fff4d9;--sky:#34364d;--ink:#fff7ea;--coral:#ff897e;--coral-dark:#ef6258;--gate-start:#242638;--gate-end:#35334e;}
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html{min-height:100%;background:var(--cream);}
  body{min-height:100vh;height:auto;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 15% 8%, rgba(255,191,63,.35), transparent 40%),radial-gradient(circle at 88% 12%, rgba(140,122,230,.28), transparent 42%),radial-gradient(circle at 50% 92%, rgba(76,175,125,.22), transparent 45%),var(--cream);}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px;position:relative;z-index:2;}

  /* ---------- intro / gate ---------- */
  #gate{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--gate-start),var(--gate-end));color:var(--ink);
    text-align:center;
    transition:opacity .7s ease, visibility .7s ease;
  }
  html[data-theme="dark"] #gate{background:radial-gradient(ellipse at 16% 24%,rgba(111,126,255,.36),transparent 43%),radial-gradient(ellipse at 84% 18%,rgba(238,112,202,.3),transparent 42%),radial-gradient(ellipse at 58% 92%,rgba(70,210,183,.24),transparent 48%),linear-gradient(160deg,var(--gate-start),var(--gate-end));}
  #gate.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .gate-card{padding:32px;}
  .gate-sub{font-size:14px;opacity:.75;margin-bottom:26px;}
  .gate-title{font-family:'Gaegu',cursive;font-size:34px;font-weight:700;margin:0 0 12px;}
  .gate-cake-button{border:0;background:transparent;padding:10px;cursor:pointer;touch-action:manipulation;}
  .gate-cake{width:min(250px,68vw);margin:4px auto 0;filter:drop-shadow(0 12px 16px rgba(80,55,20,.12));transition:transform .25s ease;}
  .gate-cake-button:hover .gate-cake{transform:translateY(-4px) scale(1.03);}
  #gate.candles-lit .gate-flame{opacity:1;filter:drop-shadow(0 0 7px rgba(255,183,3,.95));}
  .fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;}
  .firework-spark{position:absolute;left:50%;top:48%;width:9px;height:9px;border-radius:50%;background:hsl(var(--hue),95%,58%);color:hsl(var(--hue),95%,58%);box-shadow:0 0 12px currentColor;opacity:0;animation:fireworkBurst 1.45s cubic-bezier(.12,.72,.2,1) forwards;}
  @keyframes fireworkBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4);}75%{opacity:1;}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.12);}}
  #gate.celebrating .gate-cake{animation:cakePop .55s ease;}
  @keyframes cakePop{50%{transform:scale(1.14) rotate(-3deg);}}

  /* ---------- header / party scene ---------- */
  .scene{position:relative;text-align:center;padding-top:10px;opacity:0;transform:translateY(18px);overflow:visible;}
  .scene.in{animation:sceneIn .8s ease forwards;}
  @keyframes sceneIn{to{opacity:1;transform:translateY(0);}}

  .balloons{position:absolute;inset:-30px 0 auto 0;height:1px;pointer-events:none;}
  .balloon{
    position:absolute;width:34px;height:42px;border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    animation:float 5s ease-in-out infinite;
  }
  .balloon::after{content:"";position:absolute;left:50%;bottom:-16px;width:1px;height:16px;background:rgba(0,0,0,.18);}
  .b1{background:var(--coral);left:6%;top:6px;animation-delay:.1s;}
  .b2{background:var(--yolk);left:20%;top:-14px;animation-delay:.9s;}
  .b3{background:var(--violet);right:16%;top:0;animation-delay:.4s;}
  .b4{background:var(--green);right:4%;top:-10px;animation-delay:1.3s;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-12px) rotate(3deg);}}

  .hero-head{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;max-width:560px;margin:12px auto 0;padding:0 10px;text-align:left;}
  .hero-copy{min-width:0;flex:0 1 auto;}
  .hero-title-row{display:flex;align-items:center;gap:9px;}
  .hero-logo{width:78px;height:78px;flex:0 0 78px;border:4px solid #fff;border-radius:50%;object-fit:cover;box-shadow:0 8px 18px rgba(0,0,0,.16);}
  .avatar-big{display:none;}
  .hero-head h1{font-family:'Gaegu',cursive;font-size:clamp(22px,5.4vw,34px);margin:0 0 5px;line-height:1.22;word-break:keep-all;}
  .date{text-align:center;margin:8px 0 14px;}
  @media(max-width:480px){.hero-head{gap:9px;padding:0 2px;}.hero-head h1{font-size:clamp(21px,6vw,27px);}.hero-logo{width:60px;height:60px;flex-basis:60px;}.hero-title-row{gap:7px;}}
  @media(max-width:360px){.hero-head{gap:7px;}.hero-head h1{font-size:21px;}.hero-logo{width:52px;height:52px;flex-basis:52px;}.hero-title-row{gap:6px;}}
  .date{font-size:14px;letter-spacing:.03em;opacity:.7;margin-bottom:14px;}
  .lead{font-size:15px;line-height:1.7;max-width:440px;margin:0 auto 22px;opacity:.88;}

  .cake{margin:10px auto 8px;width:150px;}
  .candle-flame{
    opacity:0;transition:opacity .35s ease;
    animation:flicker 1.4s ease-in-out infinite;
    transform-box:fill-box;transform-origin:50% 100%;
  }
  .scene.candles-lit .candle-flame{opacity:1;filter:drop-shadow(0 0 5px rgba(255,183,3,.8));}
  @keyframes flicker{
    0%,100%{transform:scale(1,1);}
    25%{transform:scale(.92,1.06);}
    50%{transform:scale(1.05,.95);}
    75%{transform:scale(.97,1.03);}
  }

  .counter{
    display:inline-flex;align-items:center;gap:8px;background:#fff;color:#3a3226;
    border-radius:999px;padding:9px 18px;font-size:13px;font-weight:500;
    box-shadow:0 6px 16px rgba(0,0,0,.08);margin-bottom:26px;
  }
  .counter b{color:var(--coral-dark);font-size:15px;}

  #writeBtn{
    border:none;cursor:pointer;color:#fff;background:var(--coral-dark);
    font-family:'Gaegu',cursive;font-weight:700;font-size:20px;
    padding:16px 40px;border-radius:999px;box-shadow:0 12px 24px rgba(229,71,58,.35);
    transition:transform .15s ease;
  }
  #writeBtn:active{transform:scale(.96);}

  /* ---------- wall of letters ---------- */
  .wall-title{font-family:'Gaegu',cursive;font-size:20px;margin:48px 0 14px;text-align:center;}
  .wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;}
  .wall-column{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .wall .note{width:100%;align-self:start;min-width:0;margin:0;}
  @media(max-width:520px){.wall{grid-template-columns:1fr;}}
  .note{
    background:var(--paper);color:#3a3226;border-radius:10px;padding:14px 16px;
    box-shadow:0 6px 14px rgba(0,0,0,.07);
    font-size:13px;line-height:1.6;
    transform:rotate(var(--r,0deg));
    position:relative;
  }
  .note-sticker{position:absolute;top:-17px;width:44px;height:44px;object-fit:contain;opacity:.95;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));}
  .note-sticker.left{left:-17px;transform:rotate(-10deg);}.note-sticker.right{right:-17px;transform:rotate(9deg);}
  
  .note .who{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:30px;padding:0 44px;font-weight:700;color:var(--coral-dark);margin-bottom:4px;font-size:12.5px;text-align:center;}
  .note .msg{position:relative;z-index:2;white-space:pre-wrap;word-break:break-word;}
  .empty-wall{grid-column:1/-1;text-align:center;font-size:13px;opacity:.55;padding:18px 0;}

  /* ---------- modal / letter paper ---------- */
  #overlay{
    position:fixed;inset:0;overflow:visible;z-index:40;background:rgba(30,24,15,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .3s ease, visibility .3s ease;
  }
  #overlay.show{opacity:1;visibility:visible;}
  @media(min-width:640px){#overlay{align-items:center;}}

  #paperStage{width:100%;max-width:440px;perspective:1400px;margin-bottom:0;overflow:visible;position:relative;}
  @media(min-width:640px){#paperStage{margin-bottom:0;}}

  .paper{
    --ink:#3a3226;color:#3a3226;
    background:
      repeating-linear-gradient(var(--paper) 0 31px, rgba(75,54,31,.12) 31px 32px),
      var(--paper);
    border-radius:16px 16px 0 0;
    padding:22px 22px 18px;
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
    transform-origin:50% 50%;
    transition:transform .48s cubic-bezier(.6,0,.4,1), opacity .4s ease .1s, border-radius .3s ease;
    max-height:88vh;overflow:auto;
  }
  @media(min-width:640px){.paper{border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);}}

  .paper.fold1{transform:scaleY(.52);}
  .paper.fold2{transform:scaleY(.22) scaleX(.86);border-radius:14px;}
  .paper.fly{
    transform:translate(38vw,-46vh) scale(.16) rotate(18deg);
    border-radius:14px;opacity:0;
  }


  #paperStage.send-flow .paper{animation:letterFoldIntoEnvelope .64s cubic-bezier(.22,.72,.25,1) forwards;transform-origin:50% 48%;}
  @keyframes letterFoldIntoEnvelope{0%{transform:scale(1);opacity:1;}35%{transform:scaleY(.66) rotateX(3deg);opacity:1;}72%{transform:translateY(4px) scale(.62,.32) rotateX(6deg);opacity:1;}100%{transform:translateY(8px) scale(.38,.22);opacity:0;}}
  .envelope{position:absolute;z-index:3;left:50%;top:47%;width:min(330px,82vw);height:205px;opacity:0;pointer-events:none;border-radius:13px;background:linear-gradient(145deg,#f4c88e,#e9a96b);box-shadow:0 22px 44px rgba(52,33,20,.3);transform:translate(-50%,-30%) scale(.65);}
  #paperStage.send-flow .envelope{animation:envelopeDeliver 2.65s cubic-bezier(.22,.68,.25,1) .38s forwards;}
  @keyframes envelopeDeliver{0%{opacity:0;transform:translate(-50%,-38%) scale(.78) rotate(-2deg);}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}68%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}100%{opacity:0;transform:translate(42vw,-72vh) scale(.78) rotate(-8deg);}}
  .envelope-letter{position:absolute;z-index:1;left:12%;top:-48px;width:76%;height:160px;padding:24px 16px;background:repeating-linear-gradient(#fff9e9 0 24px,#eadfca 24px 25px);border-radius:5px;color:#5d4937;text-align:center;font:700 17px 'Gaegu',cursive;box-shadow:0 5px 12px rgba(0,0,0,.15);transform:translateY(-14px) scale(.84);}
  #paperStage.send-flow .envelope-letter{animation:letterIntoEnvelope .64s cubic-bezier(.35,.1,.3,1) .98s forwards;}
  @keyframes letterIntoEnvelope{0%{transform:translateY(-14px) scale(.84);}78%{transform:translateY(55px) scale(.84);}100%{transform:translateY(68px) scale(.82);opacity:.14;}}
  .envelope-front{position:absolute;z-index:2;inset:0;border-radius:13px;background:linear-gradient(150deg,#f4c88e,#d98d57);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);}
  .envelope-flap{position:absolute;z-index:4;top:0;left:0;width:100%;height:62%;background:linear-gradient(160deg,#ffdda9,#e6a269);clip-path:polygon(0 0,100% 0,50% 88%);transform-origin:50% 0;transform:rotateX(180deg);backface-visibility:hidden;filter:drop-shadow(0 3px 2px rgba(80,44,20,.16));}
  #paperStage.send-flow .envelope-flap{animation:envelopeClose .45s cubic-bezier(.25,.7,.25,1) 1.58s forwards;}
  @keyframes envelopeClose{0%,18%{transform:rotateX(180deg);}100%{transform:rotateX(0deg);}}
  .wax-seal{position:absolute;z-index:5;left:50%;top:59%;width:76px;height:76px;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;border:1px solid rgba(255,204,170,.58);border-radius:47% 53% 51% 49% / 51% 46% 54% 49%;background:radial-gradient(ellipse at 30% 22%,rgba(255,177,142,.72),transparent 34%),radial-gradient(circle at 52% 56%,#bd3d47 0%,#982633 64%,#6f1a2b 100%);box-shadow:0 7px 12px rgba(58,14,26,.3),inset 0 2px 3px rgba(255,238,211,.45),inset 0 -5px 8px rgba(73,0,18,.48);opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-18deg);}
  .wax-seal::before{content:"";position:absolute;z-index:2;inset:6px;border:1px solid rgba(255,220,190,.3);border-radius:inherit;box-shadow:inset 0 1px 2px rgba(255,237,217,.2),0 1px 1px rgba(72,0,16,.25);pointer-events:none;}
  .wax-seal img{display:block;position:relative;z-index:1;width:48px;height:48px;border-radius:50%;object-fit:contain;opacity:.82;filter:grayscale(1) sepia(.42) saturate(1.4) hue-rotate(302deg) brightness(1.25) contrast(.82) drop-shadow(0 1px 0 rgba(255,204,177,.36)) drop-shadow(0 -1px 0 rgba(69,0,18,.42));mix-blend-mode:soft-light;}
  #paperStage.send-flow .wax-seal{animation:waxStamp .42s cubic-bezier(.25,1.4,.4,1) 1.83s forwards;}
  @keyframes waxStamp{0%{opacity:0;transform:translate(-50%,-50%) scale(1.35) rotate(8deg);}65%{opacity:1;transform:translate(-50%,-50%) scale(.94) rotate(-2deg);}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}}
  @media(prefers-reduced-motion:reduce){.firework-spark,#gate.celebrating .gate-cake{animation-duration:.01ms!important;animation-iteration-count:1!important;}#paperStage.send-flow .paper,#paperStage.send-flow .envelope,#paperStage.send-flow .envelope-letter,#paperStage.send-flow .envelope-flap,#paperStage.send-flow .wax-seal{animation-duration:.01ms!important;animation-delay:0s!important;}}

  .paper-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .paper-head h2{font-family:'Gaegu',cursive;font-size:22px;margin:0;}
  #closeBtn{border:none;background:none;font-size:22px;cursor:pointer;color:var(--ink);opacity:.5;line-height:1;padding:4px;}

  .field-label{font-size:12px;opacity:.6;margin:14px 0 4px;}
  #toLine{font-family:'Gaegu',cursive;font-size:19px;color:var(--ink);opacity:.85;margin-bottom:2px;}
  #nickInput{
    width:100%;border:none;background:transparent;border-bottom:1px dashed rgba(0,0,0,.25);
    font-family:'Gaegu',cursive;font-size:18px;padding:4px 2px 8px;color:var(--ink);
  }
  #nickInput:focus{outline:none;border-color:var(--coral);}
  #msgInput{
    width:100%;border:none;background:transparent;resize:none;
    font-family:'Gaegu',cursive;font-size:19px;line-height:32px;color:var(--ink);
    min-height:192px;padding:2px;
  }
  #msgInput:focus{outline:none;}
  .count-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.55;margin-top:4px;}
  .sign{text-align:right;font-family:'Gaegu',cursive;font-size:16px;opacity:.75;margin-top:6px;}

  .paper-actions{display:flex;gap:10px;margin-top:18px;}
  #sendBtn{
    flex:1;border:none;cursor:pointer;color:#fff;background:var(--coral-dark);
    font-family:'Gaegu',cursive;font-weight:700;font-size:18px;padding:13px;border-radius:12px;
    transition:opacity .2s ease, transform .15s ease;
  }
  #sendBtn:disabled{opacity:.4;cursor:not-allowed;}
  #sendBtn:not(:disabled):active{transform:scale(.98);}
  .err{color:var(--coral-dark);font-size:12px;margin-top:8px;min-height:14px;}

  /* success */
  #successMsg{
    position:absolute;inset:0;z-index:7;width:100%;min-height:100%;box-sizing:border-box;padding:26px 22px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:8px;opacity:0;pointer-events:none;transition:opacity .4s ease;
    --ink:#3a3226;color:#3a3226;background:#fff4d9;border-radius:16px;
  }
  #paperStage.success-mode{min-height:260px;}
  #paperStage.success-mode #successMsg{height:260px;min-height:260px;width:100%;}
  #successMsg.show{opacity:1;}
  #successMsg .emoji{max-width:100%;font-size:clamp(27px,7vw,38px);line-height:1.35;text-align:center;overflow-wrap:anywhere;}
  #successMsg p{max-width:100%;font-family:'Gaegu',cursive;font-size:19px;line-height:1.5;text-align:center;overflow-wrap:anywhere;margin:0;}

  footer{text-align:center;font-size:11px;opacity:.55;margin-top:40px;line-height:1.7;}
  footer p{margin:2px 0;}
  footer a{color:var(--coral-dark);text-decoration:underline;opacity:.85;}
  footer .notice{opacity:.75;max-width:380px;margin:8px auto 0;}

  .warn-text{font-size:11px;opacity:.55;line-height:1.5;margin:10px 0 0;}


  #audioToggle,#themeToggle{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));z-index:60;width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);color:#3a3226;box-shadow:0 6px 16px rgba(0,0,0,.2);cursor:pointer;font-size:18px;display:grid;place-items:center;}
  #audioToggle{right:14px;}#themeToggle{right:64px;}
  #audioToggle:focus-visible,#themeToggle:focus-visible{outline:3px solid var(--coral-dark);outline-offset:3px;}
  .audio-hint{position:fixed;top:calc(63px + env(safe-area-inset-top,0px));right:8px;z-index:60;padding:7px 10px;border-radius:10px;background:var(--paper);color:#3a3226;font-size:11px;line-height:1.2;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.14);}
  .audio-hint:before{content:"";position:absolute;right:22px;top:-5px;width:10px;height:10px;background:var(--paper);transform:rotate(45deg);}
  #audioToggle:focus-visible{outline:3px solid var(--coral-dark);outline-offset:3px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---------- first-visit incident notice ---------- */
  #incidentNotice{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(24,20,18,.72);backdrop-filter:blur(5px);}
  #incidentNotice[hidden]{display:none;}
  .incident-card{width:min(100%,480px);max-height:min(88vh,680px);overflow:auto;padding:26px 24px 22px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:linear-gradient(145deg,#fffaf1,#fff);color:#3a3226;box-shadow:0 22px 70px rgba(0,0,0,.3);}
  .incident-label{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px;padding:6px 10px;border-radius:999px;background:#fff0e9;color:#a64035;font-size:12px;font-weight:700;}
  .incident-card h2{margin:0 0 14px;font-family:'Gaegu',cursive;font-size:30px;line-height:1.2;color:#8f302e;}
  .incident-card p{margin:0;font-size:14px;line-height:1.85;word-break:keep-all;}
  .incident-card .incident-thanks{margin-top:12px;color:#6b5b4d;}
  #incidentNoticeClose{display:block;width:100%;margin-top:20px;border:0;border-radius:12px;padding:12px 18px;background:#a64035;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
  #incidentNoticeClose:focus-visible{outline:3px solid #222;outline-offset:3px;}
  @media(max-width:520px){.incident-card{padding:23px 20px 19px;border-radius:18px}.incident-card h2{font-size:27px}.incident-card p{font-size:13.5px}}
</style>
</head>
<body>

<div id="incidentNotice" role="dialog" aria-modal="true" aria-labelledby="incidentNoticeTitle" aria-describedby="incidentNoticeText">
  <div class="incident-card" role="document">
    <div class="incident-label">📌 사이트 안내</div>
    <h2 id="incidentNoticeTitle">안내드립니다.</h2>

  var overlay = $('overlay'), paper = $('paper'), paperStage = $('paperStage'), writeBtn = $('writeBtn'),

  function openModal(){
    overlay.classList.add('show');

    formView.style.display = '';
    successMsg.classList.remove('show');

  function closeModal(){ overlay.classList.remove('show'); paperStage.classList.remove('send-flow','success-mode'); paper.classList.remove('fold1','fold2','fly'); }

  writeBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);

  function validate(){
    var ok = nickInput.value.trim().length > 0 && msgInput.value.trim().length > 0;
    sendBtn.disabled = !ok;
  }
  nickInput.addEventListener('input', validate);
  msgInput.addEventListener('input', function(){
    charCount.textContent = msgInput.value.length + ' / 400';
    validate();

  var sending = false;
  sendBtn.addEventListener('click', function(){
    if (sending) return;
    var nick = nickInput.value.trim().slice(0,20);
    var msg = msgInput.value.trim().slice(0,400);
    if (!nick || !msg) return;
    if (!fdb){ errMsg.textContent = '연결에 실패했어요. 새로고침 후 다시 시도해주세요.'; return; }

    paperStage.classList.remove('send-flow');
    void paperStage.offsetWidth;
    paperStage.classList.add('send-flow');

    fdb.ref(LETTERS_PATH).push({
      nickname: nick,
      message: msg,
      createdAt: Date.now()
    }).then(function(){
      setTimeout(function(){
        formView.style.display = 'none';
        paperStage.classList.add('success-mode');
        successMsg.classList.add('show');
      }, 3200);
      setTimeout(function(){
        closeModal();
        formView.style.display = '';
        paperStage.classList.remove('success-mode');
        successMsg.classList.remove('show');
        nickInput.value = ''; msgInput.value = ''; charCount.textContent = '0 / 400';
        sending = false; sendBtn.disabled = true;
      }, 4700);
    }).catch(function(e){
      console.warn(e);
      paperStage.classList.remove('send-flow');
      paper.classList.remove('fold1','fold2','fly');
      errMsg.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.';
      sending = false; sendBtn.disabled = false;
    });
  });

      $('countNum').textContent = val ? Object.keys(val).length : 0;
      wallItems = val ? Object.values(val).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }) : [];

    });

      var val = snap.val();
      $('countNum').textContent = val ? Object.keys(val).length : 0;
    }).catch(function(){});
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });

<script>
(function(){
  var notice = document.getElementById('incidentNotice');
  var close = document.getElementById('incidentNoticeClose');
  if (!notice || !close) return;
  function dismissNotice(){
    notice.hidden = true;
    document.body.style.overflow = '';
  }
  document.body.style.overflow = 'hidden';
  close.addEventListener('click', dismissNotice);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !notice.hidden) dismissNotice();
  });
  close.focus();
})();
</script>
