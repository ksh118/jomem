<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>조밈님 생일 축하드려요!</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
:root{--butter:#fff3c4;--peach:#cfe8ff;--ink:#2b2a4c;--pink:#2f6fed;--sun:#ffb703;--mint:#7ae0c3;--paper:#fffef8;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 30% 20%,var(--butter),var(--peach) 75%);color:var(--ink);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .9s ease,visibility .9s}
.scene.off{opacity:0;visibility:hidden;pointer-events:none}

/* 1. intro */
.fxbox{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fxbox i{position:absolute;bottom:-12vh;font-style:normal;animation:float linear infinite}
@keyframes float{to{transform:translateY(-125vh) rotate(40deg)}}
.cake{font-size:clamp(54px,14vw,84px);animation:bob 2.2s ease-in-out infinite}
h1{font-family:'Gaegu',cursive;margin:8px 0 0;line-height:1.15;font-size:clamp(46px,13vw,104px);position:relative}
h1 .row{display:block}
h1 .c{display:inline-block;animation:rise .8s cubic-bezier(.3,1.7,.5,1) both,bob 2.6s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 1.2s)}
h1 .row:last-child .c{color:var(--pink)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-9px)}}

/* 2. letters montage */
#cards{position:absolute;inset:0;overflow:hidden;transition:filter 1.6s ease,opacity 1.6s ease}
#cards.blur{filter:blur(11px);opacity:.5}
.card{position:absolute;width:clamp(150px,38vw,240px);padding:12px 14px;background:var(--paper);border-radius:4px;box-shadow:0 10px 26px rgba(43,42,76,.2);text-align:left;font-size:12px;line-height:1.55;transform:rotate(var(--r));animation:pop .5s cubic-bezier(.3,1.5,.6,1) both;animation-delay:var(--d)}
.card::before{content:'';position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;background:rgba(255,183,3,.7);transform:rotate(-3deg)}
.card p{margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.card b{font-family:'Gaegu',cursive;font-size:15px;color:var(--pink)}
@keyframes pop{0%{opacity:0;transform:translateY(70px) scale(.2) rotate(calc(var(--r) * 4))}65%{opacity:1;transform:translateY(-8px) scale(1.07) rotate(var(--r))}100%{opacity:1;transform:rotate(var(--r))}}
#center{position:relative;z-index:2;padding:34px 38px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,243,196,.97) 55%,rgba(255,243,196,0));opacity:0;transform:scale(.7);transition:opacity .8s,transform .9s cubic-bezier(.3,1.5,.5,1)}
#center.show{opacity:1;transform:none}
#center.done{transform:scale(1.12)}
#center .s{font-family:'Gaegu',cursive;font-size:clamp(26px,7vw,40px)}
#center .n{display:block;font-family:'Gaegu',cursive;font-size:clamp(84px,26vw,170px);line-height:1;color:var(--pink)}

/* 3. list */
#s3{justify-content:flex-start;padding:30px 18px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#s3 h2{font-family:'Gaegu',cursive;font-size:clamp(30px,8vw,46px);margin:6px 0 4px}
#s3 .sub{font-size:13px;opacity:.65;margin-bottom:22px}
#list{width:min(100%,560px);display:flex;flex-direction:column;gap:16px}
.letter{background:var(--paper);border-radius:6px;padding:18px 20px;text-align:left;box-shadow:0 8px 22px rgba(43,42,76,.14);animation:rise .7s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
.letter p{margin:0 0 10px;font-size:14.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.letter b{font-family:'Gaegu',cursive;font-size:18px;color:var(--pink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
body::before{content:'';position:fixed;inset:0;pointer-events:none;filter:blur(18px);animation:drift 14s ease-in-out infinite alternate;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.75) 0 12%,transparent 13%),radial-gradient(circle at 82% 72%,rgba(255,183,3,.28) 0 16%,transparent 17%),radial-gradient(circle at 62% 14%,rgba(122,224,195,.35) 0 10%,transparent 11%)}
@keyframes drift{to{transform:translate(4vw,-3vh) scale(1.12)}}
#go{position:fixed;right:0;bottom:env(safe-area-inset-bottom,0px);width:72px;height:72px;border:0;padding:0;background:transparent;opacity:0;cursor:default;z-index:50}
.cf{position:fixed;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none}
#center .t{display:block;margin-top:6px;font-size:14px;opacity:0;transition:opacity 1s .6s}
#center.done .t{opacity:.75}
.letter:nth-child(4n+2){background:#fff3c4}.letter:nth-child(4n+3){background:#e3f1ff}.letter:nth-child(4n){background:#e6fbf3}
.letter{position:relative}.letter::after{content:'💌';position:absolute;top:12px;right:14px;font-size:18px}
.end{margin:26px 0 0;font-size:clamp(15px,4vw,20px);opacity:0;animation:rise 1.4s 2.4s both}

/* ===== 새 배경: 별이 반짝이는 밤하늘 + 핑크 노을 ===== */
body{background:radial-gradient(circle at 25% 12%,#6a46b8,#2c2570 50%,#15123b 100%);color:#fff}
body::before{background:radial-gradient(circle at 20% 30%,rgba(255,143,171,.42) 0 14%,transparent 15%),radial-gradient(circle at 82% 72%,rgba(255,183,3,.3) 0 16%,transparent 17%),radial-gradient(circle at 62% 14%,rgba(122,224,195,.3) 0 10%,transparent 11%)}
#sky{position:fixed;inset:0;pointer-events:none}
.st{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.card,.letter,#center{color:var(--ink)}
h1 .row:last-child .c{color:#ffd166}
.hd{font-family:'Gaegu',cursive;font-size:clamp(30px,8vw,46px);margin:0 0 22px}
.hint{opacity:.8;font-size:14px;margin-top:18px}
/* 케이크 */
#cake{cursor:pointer;-webkit-tap-highlight-color:transparent}
.cs{display:flex;gap:20px;justify-content:center;margin-bottom:-10px;position:relative;z-index:1}
.cd{width:10px;height:40px;background:linear-gradient(#ff8fab,#fff);border-radius:3px;position:relative}
.cd::before{content:'';position:absolute;left:50%;top:-22px;width:13px;height:19px;margin-left:-6px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff,#ffb703 60%,#ff7b00);box-shadow:0 0 20px 7px rgba(255,183,3,.55);animation:fl .4s ease-in-out infinite alternate;transition:opacity .5s}
@keyframes fl{to{transform:scale(1.15,.88) rotate(4deg)}}
#cake.out .cd::before{opacity:0;animation:none}
.cb{font-size:clamp(110px,34vw,190px);line-height:1}
/* 쿠폰 */
#cps{width:min(100%,440px);display:flex;flex-direction:column;gap:12px}
.cp{position:relative;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:2px dashed #ffb703;border-radius:10px;padding:15px 18px;font:500 15px 'Noto Sans KR',sans-serif;cursor:pointer}
.cp small{display:block;opacity:.6;font-size:12px;margin-top:2px}
.cp.used{opacity:.7}
.cp.used::after{content:'사용 완료!';position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(-12deg);font-family:'Gaegu',cursive;font-size:22px;color:#e63946;border:2px solid #e63946;padding:0 8px;border-radius:6px;animation:rise .4s both}

/* ===== 홀로그램 배경 (동그라미 3개 제거) ===== */
body::before{inset:-35%;background:conic-gradient(from 0deg,#ff8fab,#ffd166,#7ae0c3,#8ecbff,#c59bff,#ff8fab);filter:blur(70px);opacity:.36;mix-blend-mode:screen;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:60;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.09) 42%,rgba(142,203,255,.13) 50%,rgba(255,143,171,.11) 58%,transparent 70%);background-size:250% 100%;animation:sheen 7s ease-in-out infinite alternate}
@keyframes sheen{from{background-position:100% 0}to{background-position:0 0}}
h1 .row:first-child .c{text-shadow:0 0 18px rgba(142,203,255,.9),0 0 36px rgba(255,143,171,.7)}
.letter,.card{outline:1px solid rgba(255,255,255,.6);box-shadow:0 8px 26px rgba(142,203,255,.35),0 0 0 3px rgba(255,143,171,.18)}
/* ===== 유튜버 느낌 ===== */
.ch{display:flex;align-items:center;gap:10px;margin-top:22px;padding:8px 10px;border-radius:40px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);position:relative;z-index:3}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 22px 'Gaegu',cursive;color:#2b2a4c;background:conic-gradient(#ff8fab,#ffd166,#7ae0c3,#8ecbff,#c59bff,#ff8fab)}
.nm{text-align:left;line-height:1.3;font-size:15px;font-weight:700}.nm small{display:block;font-weight:400;opacity:.8;font-size:11px}
.sb{border:0;border-radius:20px;background:#ff2d3d;color:#fff;font:700 13px 'Noto Sans KR',sans-serif;padding:9px 14px;cursor:pointer}.sb.on{background:rgba(255,255,255,.28)}
.live{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;background:#ff2d3d;color:#fff;font:700 12px 'Noto Sans KR',sans-serif;padding:6px 10px;border-radius:6px;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.6}}
#chat{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(78vw,290px);display:flex;flex-direction:column;gap:6px;text-align:left;font-size:13px;pointer-events:none;z-index:3}
.msg{background:rgba(20,18,58,.58);backdrop-filter:blur(6px);border-radius:10px;padding:6px 10px;animation:rise .4s both}.msg b{color:#ffd166;margin-right:6px}
.msg.sc{background:linear-gradient(90deg,#ffb703,#ff8fab);color:#2b2a4c;font-weight:700}

/* 케이크 SVG */
#cake svg{display:block;width:clamp(230px,64vw,360px);height:auto;overflow:visible}
.fm{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate;filter:drop-shadow(0 0 7px #ffb703);transition:opacity .35s}
#cake.out .fm{opacity:0;animation:none}
.sm{opacity:0;transform-box:fill-box;transform-origin:center}
#cake.out .sm{animation:smoke 2s ease-out both}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-46px) scale(2)}}
/* 다음 버튼 보이게 */
#go{width:auto;height:auto;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:12px 20px;border-radius:30px;background:#fff;color:#2b2a4c;font:700 15px 'Noto Sans KR',sans-serif;opacity:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .3s}
#go.wait{opacity:.35;pointer-events:none}
#s3{padding-bottom:96px}

/* ===== 편지 읽기 (봉투 → 한 장씩) ===== */
#s3{justify-content:center;padding:0;overflow:hidden}
.letter::after{content:none}
.note-sticker{position:absolute;top:-17px;width:44px;height:44px;object-fit:contain;opacity:.95;pointer-events:none;z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.note-sticker.left{left:-17px;transform:rotate(-10deg)}.note-sticker.right{right:-17px;transform:rotate(9deg)}
#cnt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:18px;font:700 20px 'Gaegu',cursive}
#allbtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;border:0;border-radius:20px;padding:9px 16px;background:rgba(255,255,255,.92);color:var(--ink);font:700 13px 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.env{position:absolute;left:50%;top:50%;width:min(330px,82vw);height:205px;border-radius:13px;background:linear-gradient(145deg,#f4c88e,#e9a96b);box-shadow:0 22px 44px rgba(20,10,40,.45);transform:translate(-50%,-50%);transition:opacity .7s,transform .7s}
.env.gone{opacity:0;transform:translate(-50%,-50%) translateY(70px) scale(.85);pointer-events:none}
.env .lt{position:absolute;z-index:1;left:12%;top:10px;width:76%;height:160px;padding:30px 12px;border-radius:5px;background:repeating-linear-gradient(#fff9e9 0 24px,#eadfca 24px 25px);color:#5d4937;font:700 19px/1.5 'Gaegu',cursive;transition:transform .9s cubic-bezier(.3,.8,.3,1) .35s}
.env.open .lt{transform:translateY(-125px)}
.env .fr{position:absolute;z-index:2;inset:0;border-radius:13px;background:linear-gradient(150deg,#f4c88e,#d98d57);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env .fp{position:absolute;z-index:4;top:0;left:0;width:100%;height:62%;background:linear-gradient(160deg,#ffdda9,#e6a269);clip-path:polygon(0 0,100% 0,50% 88%);transform-origin:50% 0;backface-visibility:hidden;transition:transform .55s}
.env.open .fp{transform:rotateX(180deg)}
.seal{position:absolute;z-index:5;left:50%;top:59%;width:70px;height:70px;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:30px;border-radius:47% 53% 51% 49%/51% 47% 53% 49%;background:radial-gradient(circle at 35% 30%,#d94a64,#8e1330);box-shadow:0 4px 10px rgba(72,0,16,.4);transition:opacity .3s,transform .3s}
.seal img{width:44px;height:44px;border-radius:50%;object-fit:contain;opacity:.85}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
#stack{position:relative;visibility:hidden;width:min(92vw,520px);height:min(66vh,540px);perspective:1400px;margin-top:20px}
.pp{position:absolute;inset:0;display:flex;flex-direction:column;text-align:left;padding:34px 26px 22px;border-radius:8px;color:#4a3b2c;background:repeating-linear-gradient(#fffdf2 0 31px,#eadfca 31px 32px);box-shadow:0 18px 44px rgba(10,5,30,.45);transform-origin:0 50%;backface-visibility:hidden}
.pp .who{font:700 26px 'Gaegu',cursive;color:#e5473a;margin-bottom:8px}
.pp .msg{flex:1;overflow-y:auto;font-size:17px;line-height:32px;white-space:pre-wrap;word-break:break-word}
.pp .note-sticker{width:64px;height:64px;top:-24px}.pp .note-sticker.left{left:-14px}.pp .note-sticker.right{right:-14px}
.pp.in{animation:unfold .85s cubic-bezier(.3,1.4,.5,1) both}
@keyframes unfold{from{opacity:0;transform:translateY(90px) scale(.4)}to{opacity:1;transform:none}}
.pp.under{z-index:1;animation:rev .85s ease both}
@keyframes rev{from{transform:scale(.94)}to{transform:none}}
.pp.flip{z-index:5;animation:turn .85s cubic-bezier(.5,0,.3,1) forwards}
@keyframes turn{60%{opacity:1}to{transform:rotateY(-115deg);opacity:0}}
#list{display:none;position:absolute;top:64px;bottom:84px;left:50%;width:min(100%,560px);transform:translateX(-50%);overflow-y:auto;padding:22px 18px 20px}
#s3.lm #list{display:flex}
#s3.lm #stack,#s3.lm #env,#s3.lm #cnt{display:none}

/* 편지 장면: 큰 제목 + 봉투가 열리며 편지가 쭈루룩 + 쭉 스크롤 */
#s3{justify-content:flex-start;padding:26px 18px 100px;overflow-y:auto;overflow-x:hidden}
#s3 .big{font-family:'Gaegu',cursive;font-weight:700;font-size:clamp(36px,10.5vw,76px);line-height:1.15;margin:4px 0 6px;word-break:keep-all}
#s3 .big span{background:linear-gradient(90deg,#fff,#8ecbff,#ff8fab,#ffd166,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 6s linear infinite;filter:drop-shadow(0 0 16px rgba(255,255,255,.35))}
@keyframes holo{to{background-position:-300% 0}}
#s3 #cnt{position:static;font:400 15px 'Noto Sans KR',sans-serif;opacity:.85;margin-bottom:6px}
#s3 .env{position:relative;left:auto;top:auto;transform:none;flex:0 0 auto;width:min(300px,76vw);height:190px;margin:140px auto 20px;transition:opacity .7s,transform .7s,height .9s,margin .9s}
#s3 .env.gone{opacity:0;transform:scale(.8);height:0;margin:0;overflow:hidden}
#s3>*{flex-shrink:0}
#s3 #list{display:flex;position:static;top:auto;bottom:auto;left:auto;transform:none;overflow:visible;padding:0;margin-top:12px;width:min(100%,560px)}
#list .letter{animation:pour .85s cubic-bezier(.3,1.3,.5,1) both;animation-delay:var(--d)}
@keyframes pour{from{opacity:0;transform:translateY(-130px) scale(.5) rotate(var(--pr,-5deg))}to{opacity:1;transform:none}}
#list .letter p{font-size:16px;line-height:1.9}
.fin{margin:30px 0 8px;text-align:center;font-family:'Gaegu',cursive;font-size:clamp(26px,7vw,40px);line-height:1.4;color:#ffd166;animation:rise 1s both}
.fin small{display:block;font-size:.6em;color:#fff;opacity:.85}

/* PDF 저장 버튼 */
#pdfBtn{align-self:center;margin:10px 0 24px;border:0;border-radius:34px;padding:16px 34px;background:linear-gradient(135deg,#ffd166,#ff8fab);color:#2b2a4c;font:700 18px 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .6s}
#pdfBtn.show{opacity:1;pointer-events:auto}
#pdfBtn:disabled{opacity:.6}
#print{display:none}
/* A4 PDF: 제목 + 벽돌(벽돌쌓기) 배치 */
@page{size:A4;margin:12mm}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body::before,body::after{display:none!important}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#2b2a4c;font-family:'Noto Sans KR',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .ph{text-align:center;margin:0 0 7mm;padding-bottom:5mm;border-bottom:2px dashed #ffb703}
  #print h1{font:700 30pt/1.2 'Gaegu',cursive;margin:0;color:#2f6fed}
  #print .pd{font-size:11pt;margin-top:2mm;opacity:.8}
  #print .pcols{column-count:3;column-gap:5mm}
  #print .pl{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;margin:0 0 5mm;padding:4mm 4mm 3mm;border-radius:2.5mm;border:.3mm solid rgba(43,42,76,.18);font-size:8.6pt;line-height:1.6}
  #print .pl p{margin:0 0 2mm;white-space:pre-wrap;word-break:break-word}
  #print .pl b{font:700 11pt 'Gaegu',cursive;color:#2f6fed}
  #print .pl:nth-child(4n+1){background:#fffef8}#print .pl:nth-child(4n+2){background:#fff3c4}#print .pl:nth-child(4n+3){background:#e3f1ff}#print .pl:nth-child(4n){background:#e6fbf3}
}
</style>
</head>
<body>

<section class="scene" id="s1">
  <div id="fx" class="fxbox"></div>
  <div class="cake">🎂</div>
  <h1 id="title"><span class="row">조밈님</span><span class="row">생일 축하드려요!</span></h1>
</section>

<section class="scene off" id="s2">
  <div id="cards"></div>
  <div id="center">
    <span class="s">조밈님에게</span>
    <span class="n" id="num">0</span>
    <span class="s">명이 편지를 보냈습니다</span>
    <span class="t" id="tail"></span>
  </div>
</section>

<section class="scene off" id="s3">
  <h2 class="big"><span>조밈님에게 보낸 편지</span> 💌</h2>
  <div id="cnt"></div>
  <div class="env" id="env" aria-hidden="true">
    <div class="lt">조밈님께<br>축하의 마음을 담아</div>
    <div class="fr"></div><div class="fp"></div>
    <div class="seal"><img src="https://i.ibb.co/7JqdNgxn/image.png" alt="" onerror="this.replaceWith('💌')"></div>
  </div>
  <div id="list"></div>
  <button id="pdfBtn" type="button">📄 PDF로 저장하기</button>
</section>
<div id="print"></div>

<section class="scene off" id="s5">
  <h2 class="hd">소원을 빌고 촛불을 꺼요 ✨</h2>
  <div id="cake"><svg viewBox="0 0 240 230" aria-label="생일 케이크">

    var t = String(it.createdAt || '') + '|' + (it.nickname || '익명') + '|' + it.message, h = 0;
    for (var i = 0; i < t.length; i++) h = ((h * 31) + t.charCodeAt(i)) >>> 0;
    if (h % 3) return null;
    var im = document.createElement('img'); im.className = 'note-sticker ' + (((h >>> 2) % 2) ? 'right' : 'left');
    im.src = STK[(h >>> 1) % STK.length]; im.alt = ''; return im;
  }
  function entry(it, cls){
    var el = document.createElement('div'); el.className = cls;
    var st = stk(it); if (st) el.appendChild(st);
    var w = document.createElement('div'); w.className = 'who'; w.textContent = 'From. ' + (it.nickname || '익명');
    var m = document.createElement('div'); m.className = 'msg'; m.textContent = it.message;
    if (cls === 'pp'){ el.appendChild(w); el.appendChild(m); }
    else { m = document.createElement('p'); m.textContent = it.message; w = document.createElement('b'); w.textContent = 'From. ' + (it.nickname || '익명'); el.appendChild(m); el.appendChild(w); }
    return el;
  }
  function buildList(arr){
    var list = $('list'); list.textContent = '';
    arr.forEach(function(it, i){ var el = entry(it, 'letter'); el.style.setProperty('--d', Math.min(i, 16) * 0.11 + 's'); el.style.setProperty('--pr', (i % 2 ? 5 : -5) + 'deg'); list.appendChild(el); });
  }
  /* 흐름: 인트로 → 촛불 → 편지 몽타주 → 봉투 열기·한 장씩 읽기 → 마무리. 애니메이션이 끝나야 다음 버튼이 켜진다 */
  var stage = 0, busy = false, items = SAMPLE, ord = [], totalCount = SAMPLE.length;
  function swap(a, b){ $(a).classList.add('off'); $(b).classList.remove('off'); }
  function setBusy(v){ busy = v; $('go').classList.toggle('wait', v); }
  function lock(ms){ setBusy(true); return sleep(ms).then(function(){ setBusy(false); }); }
  function ts(x){ var v = x.createdAt; return typeof v === 'number' ? v : (Date.parse(v) || 0); }
  function montage(){
    setBusy(true);
    Promise.race([loadP, sleep(2500)]).then(function(){
      items = data ? data.items : SAMPLE; totalCount = data ? data.total : SAMPLE.length;
      var longFirst = items.slice().sort(function(a,b){ return b.message.length - a.message.length; });
      $('tail').textContent = '가장 긴 편지는 ' + longFirst[0].message.length + '자나 됐어요 ✉️';
      swap('s5', 's2');
      return sleep(900).then(function(){ return runMontage(longFirst, totalCount); });
    }).then(function(){
      burst(); $('center').classList.add('done'); $('cards').classList.add('blur');
      return sleep(1500);
    }).then(function(){ setBusy(false); });
  }
  function openLetters(){
    setBusy(true); $('go').style.display = 'none';
    ord = (data ? data.items.slice().reverse() : SAMPLE.slice()).sort(function(a,b){ return ts(a) - ts(b); });
    $('cnt').textContent = '총 ' + totalCount.toLocaleString('ko-KR') + '통 · 먼저 보내주신 분부터 쭉 보여드려요';
    swap('s2', 's3');
    sleep(1000).then(function(){ $('env').classList.add('open'); burst(); return sleep(1500); }).then(function(){
      $('env').classList.add('gone'); buildList(ord);
      var fin = document.createElement('div'); fin.className = 'fin'; fin.style.animationDelay = (Math.min(ord.length, 16) * 0.11 + 1) + 's';
      fin.innerHTML = '생일 축하해요 조밈님! 🎂<small>오늘도 내일도 웃을 일만 가득하길 💛</small>'; $('s3').insertBefore(fin, $('pdfBtn')); sleep(1800).then(function(){ $('pdfBtn').classList.add('show'); });
    });
  }
  var steps = [ function(){ swap('s1', 's5'); setBusy(true); }, montage, openLetters ];
  function go(){ if (busy || stage >= steps.length) return; steps[stage++](); }

  /* ---------- PDF로 저장 (A4, 저장 시점의 모든 편지를 새로 불러와서 넣음) ---------- */
  function fetchAll(){
    return fetch(DB_URL + '/' + PATH + '.json').then(function(r){ return r.json(); }).then(function(v){
      v = v || {}; var arr = Object.keys(v).sort().map(function(k){ return v[k]; }).filter(function(x){ return x && x.message; });
      if (!arr.length) throw 0; return arr;
    }).catch(function(){ return ord.length ? ord : SAMPLE; });
  }
  $('pdfBtn').addEventListener('click', function(){
    var btn = this; btn.disabled = true; btn.textContent = '편지 모으는 중…';
    fetchAll().then(function(arr){
      var root = $('print'); root.textContent = '';
      var h = document.createElement('div'); h.className = 'ph';
      var t = document.createElement('h1'); t.textContent = '조밈님에게 보낸 편지 💌';
      var d = document.createElement('div'); d.className = 'pd'; d.textContent = '2026년 10월 10일 · 총 ' + arr.length.toLocaleString('ko-KR') + '통';
      h.appendChild(t); h.appendChild(d); root.appendChild(h);
      var cols = document.createElement('div'); cols.className = 'pcols';
      arr.forEach(function(it){
        var el = document.createElement('div'); el.className = 'pl';
        var p = document.createElement('p'); p.textContent = it.message;
        var b = document.createElement('b'); b.textContent = 'From. ' + (it.nickname || '익명');
        el.appendChild(p); el.appendChild(b); cols.appendChild(el);
      });
      root.appendChild(cols);
      return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){ return sleep(300); });
    }).then(function(){ window.print(); }).then(function(){ btn.disabled = false; btn.textContent = '📄 PDF로 저장하기'; });
  });
  lock(2600);
  $('go').addEventListener('click', go);
  document.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight') go(); });
})();
