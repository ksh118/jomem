<div class="stepbox"><div class="steph"><i>3</i>같이 보여줄 규칙 <small>누르면 팝업에 바로가기 버튼이 생겨요 (선택)</small></div><div class="chips" id="noticeChips">${rules.map(([id,t])=>`<button type="button" class="chip${n.rules.includes(id)?' on':''}" data-rule="${esc(id)}">${esc(t)}</button>`).join('')}</div></div>

function renderNoticePreview(n,rules){const p=$('noticePreview');if(!p)return;const names=(n.rules||[]).map(id=>rules.find(x=>x[0]===id)?.[1]).filter(Boolean);p.innerHTML=`<div class="np-top"><span class="np-ic">📢</span><div><div class="np-kicker">공지사항</div><h2 class="notice-preview-title">${esc(n.title||'공지 제목')}</h2></div></div>${(n.blocks||[]).map(b=>`<h3 class="notice-preview-box-title">${esc(b.title||'소제목')}</h3><section class="notice-preview-box"><div>${safe(b.content||'내용을 적어주세요')}</div></section>`).join('')}${names.length?`<div class="notice-linked"><b>확인할 규칙</b><div>${names.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:''}<button class="notice-close-demo" type="button">닫기</button>`}

function drawWheel(){const root=$('view-wheel');root.innerHTML=`<div class="pagehead"><div><h1>돌림판</h1><div class="sub">항목을 줄마다 적고 돌려서 뽑으세요.</div></div><span class="pill good">브라우저에서 작동</span></div><div class="wheel-studio"><section class="wheel-stage"><div class="wheel-pointer"></div><canvas id="wheelCanvas" class="wheel-canvas" width="500" height="500"></canvas><button id="spinBtn" class="spin-button">돌리기</button><div id="winnerBox"></div></section><section class="wheel-settings"><div class="flex"><div><h2>참가 항목</h2><div class="hint">한 줄에 한 명 또는 상품을 입력하세요.</div></div><span class="pill" id="wheelCount">4개</span></div><textarea id="wheelText" class="wheel-textarea" spellcheck="false" aria-label="돌림판 항목"></textarea><div class="edit-actions"><button id="addWheelItem" class="btn-soft">＋ 항목 추가</button><button id="resetWheel">예시로 초기화</button></div><div class="wheel-footnote">최소 2개 항목이 필요합니다. 입력한 목록은 이 브라우저에서만 유지됩니다.</div></section></div>`;$('wheelText').value=wheelItems.join('\n');paintWheel();$('wheelText').oninput=()=>{wheelItems=$('wheelText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);$('wheelCount').textContent=wheelItems.length+'개';$('spinBtn').disabled=wheelItems.length<2;paintWheel()};$('addWheelItem').onclick=()=>{$('wheelText').value+=($('wheelText').value?'\n':'')+'새 항목';$('wheelText').dispatchEvent(new Event('input'))};$('resetWheel').onclick=()=>{$('wheelText').value='참가자 1\n참가자 2\n참가자 3\n꽝';$('wheelText').dispatchEvent(new Event('input'));$('winnerBox').innerHTML=''};$('spinBtn').onclick=spinWheel}
function drawWheelItems(){const ta=$('wheelText');if(ta){ta.value=wheelItems.join('\n');$('wheelCount').textContent=wheelItems.length+'개'}}
function paintWheel(){const c=$('wheelCanvas');if(!c)return;const ctx=c.getContext('2d'),n=Math.max(wheelItems.length,1),cx=250,cy=250,r=226,colors=['#3867d6','#e36e3d','#30a46c','#8859c7','#d24c73','#d3a225','#258ca5','#536273'];ctx.clearRect(0,0,500,500);const slice=Math.PI*2/n;wheelItems.forEach((t,i)=>{const a=spinAngle+i*slice-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+slice);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(a+slice/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText(String(t).slice(0,18),r-18,6);ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#d8dce4';ctx.stroke();ctx.fillStyle='#333';ctx.textAlign='center';ctx.font='bold 16px system-ui';ctx.fillText('GO',cx,cy+5)}
function spinWheel(){if(spinning||wheelItems.length<2)return;spinning=true;$('spinBtn').disabled=true;$('winnerBox').innerHTML='';const n=wheelItems.length,win=Math.floor(Math.random()*n),slice=2*Math.PI/n;/* pointer is at top; align chosen segment center to pointer */const target=((Math.PI*2*6)+(Math.PI*2-(win+.5)*slice))%(Math.PI*2),start=spinAngle,delta=(target-start%(Math.PI*2)+Math.PI*2)%(Math.PI*2),end=start+Math.PI*2*6+delta;const t0=performance.now(),dur=4800;function frame(now){const t=Math.min(1,(now-t0)/dur),ease=1-Math.pow(1-t,4);spinAngle=start+(end-start)*ease;paintWheel();if(t<1)requestAnimationFrame(frame);else{spinAngle=end%(Math.PI*2);paintWheel();spinning=false;$('spinBtn').disabled=false;$('winnerBox').innerHTML=`<div class="winnerbox">🎉 당첨: ${esc(wheelItems[win])}</div>`}}requestAnimationFrame(frame)}
function drawCatch(){const root=$('view-catch');root.innerHTML=`<div class="pagehead"><div><h1>캐치마인드</h1><div class="sub">정답을 적고 시작을 누르면, 채팅에서 가장 먼저 맞힌 사람을 찾아줘요.</div></div><span class="pill warn" id="catchState">대기 중</span></div>
<div class="panel"><div class="stepbox"><div class="steph"><i>1</i>이번 문제 정답</div><input id="answerInput" class="bigin" placeholder="예: 고양이"><div class="hint" style="margin-top:6px">시청자는 채팅에 <b>!고양이</b> 처럼 입력해요. 띄어쓰기·대소문자는 무시해요.</div></div>
<div class="stepbox"><div class="steph"><i>2</i>판정 시작</div><div class="edit-actions"><button id="startCatch" class="btn-primary big">▶ 정답 판정 시작</button><button id="stopCatch" class="big">■ 중지</button></div><div id="catchStatus" class="status"></div></div></div>
<div class="panel"><div class="flex"><h2 style="margin:0">정답자 <span class="pill">맞힌 순서</span></h2><button id="clearAnswers">기록 지우기</button></div><div id="answerList" style="margin-top:12px"></div></div>
<details class="panel adv"><summary>🔌 실제 라이브 채팅 연결 <small>(방송 중에만 필요해요)</small></summary><div class="connect-card"><div class="flex"><strong>YouTube 라이브 채팅</strong><span id="ytPill" class="pill warn">연결 안 됨</span></div><label>라이브 영상 ID</label><input id="ytVideoId" placeholder="youtube.com/live/ 뒤의 영상 ID"><button id="ytConnect" class="btn-soft" style="margin-top:9px">Google 계정으로 YouTube 연결</button><div class="hint" style="margin-top:8px">YouTube Data API v3 사용 설정이 필요해요.</div></div><div class="connect-card"><div class="flex"><strong>치지직 라이브 채팅</strong><span class="pill warn">서버 필요</span></div><label>치지직 채널 ID</label><input id="chzzkChannel" placeholder="치지직 채널 ID"><p class="hint" style="margin:8px 0 0">치지직 채팅은 앱 인증(서버)이 필요해서 지금은 연결할 수 없어요.</p></div></details>
<details class="panel adv"><summary>🧪 연습해보기 <small>(채팅 없이 판정 화면 테스트)</small></summary><div class="row" style="margin-top:12px"><input id="testName" placeholder="닉네임"><input id="testMessage" placeholder="예: !고양이"></div><button id="sendTest" style="margin-top:9px">테스트 채팅 보내기</button><div class="hint" style="margin-top:7px">관리자 화면에만 보여요.</div></details>`;
const saved=JSON.parse(localStorage.getItem('catchConfig')||'{}');$('answerInput').value=saved.answer||'';$('chzzkChannel').value=saved.chzzk||'';$('ytVideoId').value=saved.ytVideo||'';
$('answerInput').oninput=saveCatchConfig;$('chzzkChannel').onchange=saveCatchConfig;$('ytVideoId').onchange=saveCatchConfig;
if(localStorage.getItem('catchRunning')){$('catchState').textContent='판정 중';$('catchState').className='pill good'}
$('startCatch').onclick=()=>{if(!$('answerInput').value.trim()){setStatus('catchStatus','먼저 정답을 입력하세요.','err');$('answerInput').focus();return}saveCatchConfig();localStorage.setItem('catchRunning','1');$('catchState').textContent='판정 중';$('catchState').className='pill good';setStatus('catchStatus','판정을 시작했어요. 이제 채팅에서 정답이 들어오면 자동으로 찾아줘요.','ok')};
$('stopCatch').onclick=()=>{localStorage.removeItem('catchRunning');$('catchState').textContent='중지됨';$('catchState').className='pill warn';stopYt();setStatus('catchStatus','판정을 멈췄어요.','')};
$('clearAnswers').onclick=()=>{localStorage.removeItem('catchAnswers');renderAnswers()};
$('sendTest').onclick=()=>processGuess($('testName').value||'익명 참가자',$('testMessage').value||'');$('testMessage').onkeydown=e=>{if(e.key==='Enter')$('sendTest').click()};
$('ytConnect').onclick=connectYoutube;renderAnswers()}

function saveCatchConfig(){localStorage.setItem('catchConfig',JSON.stringify({answer:$('answerInput').value,chzzk:$('chzzkChannel').value,ytVideo:$('ytVideoId').value}))}function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,'')}function processGuess(name,msg){if(!localStorage.getItem('catchRunning')){setStatus('catchStatus','먼저 “정답 판정 시작”을 눌러주세요.','err');return}const m=String(msg).trim(),guess=m.startsWith('!')?m.slice(1):m;if(norm(guess)===norm($('answerInput').value)){const rows=JSON.parse(localStorage.getItem('catchAnswers')||'[]');if(!rows.some(x=>x.name===name)){rows.unshift({name,msg,time:new Date().toLocaleTimeString('ko-KR'),correct:true});localStorage.setItem('catchAnswers',JSON.stringify(rows));renderAnswers();setStatus('catchStatus',`🎉 ${name}님이 정답을 맞혔습니다!`,'ok')}}else setStatus('catchStatus',`${name}: ${m} (오답)`,'')}
function renderAnswers(){const rows=JSON.parse(localStorage.getItem('catchAnswers')||'[]'),root=$('answerList');if(!root)return;root.innerHTML=rows.length?rows.map((r,i)=>`<div class="chatline"><span class="pill good">${i===0?'정답':'정답'}</span><strong>${esc(r.name)}</strong><span>${esc(r.msg)}</span><span class="hint" style="margin-left:auto">${esc(r.time)}</span></div>`).join(''):'<div class="empty">아직 정답 입력이 없습니다.</div>'}
async function connectYoutube(){if(local){setStatus('catchStatus','YouTube 라이브 연결은 HTTPS에서 관리자 Google 로그인 후 이용할 수 있습니다.','err');return}ytVideo=$('ytVideoId').value.trim();if(!ytVideo){setStatus('catchStatus','먼저 YouTube 라이브 영상 ID를 입력하세요.','err');return}const p=new firebase.auth.GoogleAuthProvider();p.addScope('https://www.googleapis.com/auth/youtube.readonly');try{const r=await auth.signInWithPopup(p);const c=firebase.auth.GoogleAuthProvider.credentialFromResult(r);ytToken=c?.accessToken||'';if(!ytToken)throw Error('YouTube 권한을 확인하지 못했습니다.');$('ytPill').textContent='연결 중';$('ytPill').className='pill warn';const br=await fetch('https://youtube.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id='+encodeURIComponent(ytVideo),{headers:{Authorization:'Bearer '+ytToken}});const bj=await br.json();if(!br.ok||!bj.items?.[0]?.liveStreamingDetails?.activeLiveChatId)throw Error(bj.error?.message||'활성 라이브 채팅을 찾지 못했습니다. 영상 ID/API 사용 설정을 확인하세요.');ytNext='';$('ytPill').textContent='실시간 연결';$('ytPill').className='pill good';setStatus('catchStatus','YouTube 라이브 채팅 연결됨. 정답 입력을 기다립니다.','ok');pollYoutube(bj.items[0].liveStreamingDetails.activeLiveChatId)}catch(e){$('ytPill').textContent='연결 안 됨';$('ytPill').className='pill warn';setStatus('catchStatus','YouTube 연결 실패: '+e.message,'err')}}
async function pollYoutube(chatId){if(!ytToken)return;try{let u='https://youtube.googleapis.com/youtube/v3/liveChat/messages?part=snippet,authorDetails&liveChatId='+encodeURIComponent(chatId)+'&maxResults=200';if(ytNext)u+='&pageToken='+encodeURIComponent(ytNext);const r=await fetch(u,{headers:{Authorization:'Bearer '+ytToken}}),j=await r.json();if(!r.ok)throw Error(j.error?.message||'라이브 채팅 요청 실패');ytNext=j.nextPageToken||'';(j.items||[]).forEach(x=>processGuess(x.authorDetails?.displayName||'시청자',x.snippet?.displayMessage||''));ytTimer=setTimeout(()=>pollYoutube(chatId),Math.max(5000,j.pollingIntervalMillis||5000))}catch(e){setStatus('catchStatus','YouTube 채팅 연결이 끊겼습니다: '+e.message,'err');stopYt()}}function stopYt(){ytToken='';clearTimeout(ytTimer);$('ytPill')&&($('ytPill').textContent='연결 안 됨',$('ytPill').className='pill warn')}
window.addEventListener('message',e=>{const f=$('previewFrame');if(!f||e.source!==f.contentWindow)return;const m=e.data||{};if(m.type==='admin-preview-ready'){sendPreview(editTab==='rules'?selectedGame:'home')}else if(m.type==='admin-preview-size'){f.style.height=Math.max(180,Math.min(760,m.height+12))+'px'}else if(m.type==='admin-preview-select-brand'&&editTab==='basic'){drawBasicInspector(m.key)}else if(m.type==='admin-preview-select-game'&&(data.games[m.id]||data.pages[m.id])){selectedGame=m.id;if(editTab==='rules'){selectedSection=0;drawRules()}else if(editTab==='buttons')drawBasicInspector('game:'+m.id)}else if(m.type==='admin-preview-select-section'&&editTab==='rules'&&(data.games[m.id]||data.pages[m.id])){selectedGame=m.id;selectedSection=Math.max(0,m.index);drawRules()}});



let adminEmails={},authCheckUid='';
function showAccessDenied(message){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginBtn').classList.add('hidden');$('deniedLogout').classList.remove('hidden');setStatus('loginStatus','권한이 없습니다. 관리자에게 문의하세요. '+(message||''),'err')}
async function openAdmin(u){if(!u||adminOpening)return;adminOpening=true;user=u;try{const snap=await db.ref('site_content').once('value'),v=snap.val();if(v?.schemaVersion===2&&v.config)data=v.config;ensure();if(u.email?.toLowerCase()===ADMIN_EMAIL){const a=await db.ref('admin_emails').once('value');adminEmails=a.val()||{};if(!adminEmails[adminEmailKey(ADMIN_EMAIL)]){await db.ref('admin_emails/'+adminEmailKey(ADMIN_EMAIL)).set(true);adminEmails[adminEmailKey(ADMIN_EMAIL)]=true}}showApp(u.displayName||u.email);}catch(e){showAccessDenied('관리자 권한을 확인하지 못했습니다.');console.error(e)}finally{adminOpening=false}}
async function checkAdminAccess(u){if(!u){authCheckUid='';$('login').classList.remove('hidden');$('loginBtn').classList.remove('hidden');$('deniedLogout').classList.add('hidden');$('app').classList.add('hidden');user=null;return}if(authCheckUid===u.uid){while(adminOpening)await new Promise(resolve=>setTimeout(resolve,25));return}authCheckUid=u.uid;try{const token=await u.getIdTokenResult(),email=(u.email||'').toLowerCase(),google=token.claims?.firebase?.sign_in_provider==='google.com',allowed=email===ADMIN_EMAIL||((email.endsWith('@gmail.com'))&&google&&(await db.ref('admin_emails/'+adminEmailKey(email)).once('value')).val()===true);if(!u.emailVerified||!google||(!email.endsWith('@gmail.com'))||!allowed){user=u;showAccessDenied();return}await openAdmin(u)}catch(e){user=u;showAccessDenied('Google 계정 인증을 확인하지 못했습니다.')}}
function bootstrap(){try{if(location.protocol!=='file:'&&!FORCE_LOCAL&&window.firebase&&firebase.initializeApp){firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.database();local=false;$('login').classList.remove('hidden');$('deniedLogout').onclick=()=>auth.signOut();$('logoutBtn').onclick=()=>auth.signOut();$('loginBtn').onclick=()=>{const p=new firebase.auth.GoogleAuthProvider();p.addScope('https://www.googleapis.com/auth/webmasters.readonly');p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).then(async r=>{const c=firebase.auth.GoogleAuthProvider.credentialFromResult(r);gscAccessToken=c?.accessToken||'';await checkAdminAccess(r.user);for(let i=0;i<120&&app.classList.contains('hidden')&&authCheckUid===r.user.uid;i++)await new Promise(resolve=>setTimeout(resolve,25));if(gscAccessToken&&user?.uid===r.user.uid&&!app.classList.contains('hidden'))connectGsc(gscAccessToken)}).catch(e=>setStatus('loginStatus',e.message,'err'))};auth.onAuthStateChanged(u=>checkAdminAccess(u))}else{startLocal()}}catch(e){startLocal()}}
bootstrap();

})();
