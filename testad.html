<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조밈 설명서 관리자</title>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#090a0d;--panel:#15171c;--line:#292c33;--muted:#9b9ea8;--text:#f4f4f5;--green:#55d585;--red:#ff7676}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#20232a;border-radius:11px;padding:10px 14px}button:hover{border-color:#526c5c}input,textarea,select{width:100%;border:1px solid var(--line);background:#0f1115;border-radius:10px;padding:11px 12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--green)}textarea{min-height:110px;resize:vertical}label{display:block;font-size:13px;font-weight:700;color:#c9cbd0;margin:12px 0 6px}.wrap{max-width:1180px;margin:auto;padding:30px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.top h1{font-size:24px;margin:0}.hint{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.login{max-width:440px;margin:12vh auto}.login h1{margin:0 0 4px}.grid{display:grid;grid-template-columns:245px 1fr;gap:16px}.side{position:sticky;top:16px;align-self:start}.side button{display:block;width:100%;text-align:left;margin:7px 0}.side button.sel{background:#15351f;border-color:#24603a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.primary{background:#1b6c38;border-color:#2e9b56;font-weight:700}.danger{color:var(--red)}.section{padding:15px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#101216}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{display:flex;align-items:center;gap:8px;margin:8px 0}.item input{flex:1}.item button{padding:8px 11px}.status{margin-top:10px;color:var(--muted);min-height:24px}.status.ok{color:var(--green)}.status.err{color:var(--red)}.preview{max-height:56px;max-width:100px;object-fit:cover;border-radius:8px;display:none;margin-top:8px}.hidden{display:none!important}.muted{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:6px}.side button{white-space:nowrap;width:auto}.row,.row3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<section id="login" class="card login"><h1>시참 설명서 관리자</h1><div class="hint">허용된 Google 계정으로 로그인하세요.</div><div class="actions" style="margin-top:14px"><button id="loginBtn" class="primary">Google 계정으로 로그인</button><a href="./index.html" class="hint" style="padding:10px">사이트로 돌아가기</a></div><div id="loginStatus" class="status" role="status"></div></section>
<section id="editor" class="hidden"><div class="top"><div><h1>조밈 시참 설명서 편집</h1><div id="who" class="hint"></div></div><div class="actions"><button id="saveBtn" class="primary">변경사항 저장</button><button id="logoutBtn">로그아웃</button></div></div>
<div class="grid"><aside class="card side" id="nav"></aside><div><div id="homeEditor" class="card hidden"></div><div id="gameEditor" class="card hidden"></div><div class="hint">저장하면 방문자 페이지에 바로 반영됩니다. 텍스트는 그대로 표시되며 HTML/스크립트는 실행되지 않습니다.</div><div id="status" class="status" role="status"></div></div></div></section></main>
<script>
(function(){
const cfg={apiKey:"AIzaSyABvR4Qzqt8lJpy3oH52nuXMeAcOcwfkOY",authDomain:"jomeme-stream-guide.firebaseapp.com",databaseURL:"https://jomeme-stream-guide-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"jomeme-stream-guide",storageBucket:"jomeme-stream-guide.firebasestorage.app",messagingSenderId:"1045076939348",appId:"1:1045076939348:web:686b3c91921a55792793c1",measurementId:"G-PJXSJ581PH"};
const ADMIN_EMAIL='feelbox.gsh@gmail.com';
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.database();
const defaults={brand:{navTitle:'조밈 시참 설명서',homeTitle:'조밈 시참 설명서',homeSubtitle:'컨텐츠 참여 전 아래 항목을 선택해 규칙을 확인하세요.',navLogo:'./youtube1.jpg',homeLogo:'./jome.e.png'},games:{
battle:{title:'야생 배틀로얄',subtitle:'최후의 1인 우승',image:'',sections:[{title:'게임 방식',kind:'lines',items:['게임이 시작되면 무적 시간 15분이 주어짐','15분동안 야생에서 자유롭게 파밍 후, 무적 시간이 끝나면 PVP 진행','PVP가 진행되는 동안, 자기장이 x=0, y=0 좌표를 기준으로 줄어듦','4차 자기장까지 줄어들게 되면 데스매치장으로 이동 후, 데스매치 진행'],winner:'🏆 최후의 1인은 우승'},{title:'상세 규칙',kind:'bullets',items:['티밍'],winner:''}]},
school:{title:'학교 술래잡기',subtitle:'도망자 생존 or 술래 승리',image:'',sections:[{title:'게임 방식',kind:'lines',items:['게임이 시작되면 도망자는 학교에서 생존해야 함','도망자는 북도에서만 생성 되는 금을 획득 후, 특수 아이템으로 교환 가능','술래가 맵에 설치된 발전기를 모두 파괴하면 도망자에게 어둠 디버프와 주기적인 발광 효과가 적용됨','파괴된 발전기는 도망자가 수리할 수 있음 (수리 완료 시, 금 8개 지급)','도망자는 맵 곳곳에 배치된 구급함을 열면 특별한 아이템 획득 가능'],winner:'🏃 제한 시간이 끝날 때까지 도망자가 생존하면 도망자 승리\n🔦 도망자 전원이 탈락하면 술래 승리'},{title:'상세 규칙',kind:'bullets',items:['맵탈주','고의적인 트롤','버그 악용'],winner:''}]},
city:{title:'도시능력자',subtitle:'랜덤 능력 배틀',image:'',sections:[{title:'게임 방식',kind:'lines',items:['게임이 시작되면 모두에게 랜덤한 능력이 부여됨','본인의 능력 확인: /aw check','능력 확정: /aw yes','넘기고 싶다면 (최대 2회): /aw no','모두의 능력이 확정되면 무적 시간이 주어짐','무적 시간이 끝나면 PVP 진행 및 자기장 축소'],winner:'🏆 최후의 1인은 우승'},{title:'상세 규칙',kind:'bullets',items:['티밍','맵 탈주','허용 명령어: /cleartitle (타이틀 버그 해결)','허용 명령어: /nightvision (야간투시 효과 부여)'],winner:''}]},
catch:{title:'조밈을 잡아라!',subtitle:'조밈 추격전',image:'',sections:[{title:'게임 방식',kind:'lines',items:['게임이 시작되면 조밈은 랜덤 위치에서 출발 + 5분 타이머 가동','타이머가 끝나면 시청자들은 추격 시작 — 나침반으로 추적 가능','조밈이 시청자에게 잡히면 게임 종료!'],winner:'🏆 조밈을 잡은 시청자는 우승'}]},
mind:{title:'캐치마인드',subtitle:'건축으로 정답 맞추기',image:'',sections:[{title:'게임 방식',kind:'lines',items:['게임이 시작되면 출제자가 주제를 지정 후, 해당 주제를 바탕으로 건축 진행'],winner:'🏆 정답을 가장 먼저 맞힌 참가자는 우승'},{title:'상세 규칙',kind:'bullets',items:[],winner:''}]}
}};
let data=structuredClone(defaults),active='__home',loading=true;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(msg,type){const e=$('status');e.textContent=msg;e.className='status '+(type||'')}
function validImage(v){return /^(https:\/\/|\.\/|\/|data:image\/(png|jpeg|webp|gif);base64,)/i.test(String(v||''))}
function ensure(){data.brand=data.brand||structuredClone(defaults.brand);data.games=data.games||{};Object.keys(defaults.games).forEach(k=>{if(!data.games[k])data.games[k]=structuredClone(defaults.games[k])});}
function drawNav(){const nav=$('nav');nav.replaceChildren();const home=document.createElement('button');home.textContent='🏠 홈 정보';home.className=active==='__home'?'sel':'';home.onclick=()=>select('__home');nav.append(home);Object.entries(data.games).forEach(([id,g])=>{const b=document.createElement('button');b.textContent='🎮 '+g.title;b.className=active===id?'sel':'';b.onclick=()=>select(id);nav.append(b)});const add=document.createElement('button');add.textContent='＋ 새 게임 탭 추가';add.onclick=()=>{const id='custom-'+Date.now().toString(36);data.games[id]={title:'새 게임',subtitle:'게임 설명',image:'',sections:[{title:'게임 방식',kind:'lines',items:[''],winner:''}]};select(id)};nav.append(add)}
function select(id){if(!loading&&active!==id){try{collect()}catch(e){status(e.message,'err')}}active=id;drawNav();$('homeEditor').classList.toggle('hidden',id!=='__home');$('gameEditor').classList.toggle('hidden',id==='__home');id==='__home'?drawHome():drawGame(id);status('')}
function drawHome(){const e=$('homeEditor');e.innerHTML='<h2>홈과 상단 로고</h2><div class="row"><div><label>상단 메뉴 제목</label><input id="brandNav"></div><div><label>홈 큰 제목</label><input id="brandHome"></div></div><label>홈 설명 문구</label><input id="brandSub"><div class="row"><div><label>상단 로고 이미지 주소</label><input id="navLogo" placeholder="https://... 또는 ./logo.png"><input type="file" id="navFile" accept="image/png,image/jpeg,image/webp,image/gif"><img id="navPrev" class="preview"></div><div><label>홈 큰 로고 이미지 주소</label><input id="homeLogo" placeholder="https://... 또는 ./logo.png"><input type="file" id="homeFile" accept="image/png,image/jpeg,image/webp,image/gif"><img id="homePrev" class="preview"></div></div><p class="hint">이미지 파일은 300KB 이하로 선택하세요. 또는 웹에 올린 이미지 주소를 붙여넣을 수 있습니다.</p><h3>게임 버튼</h3><div id="cards"></div>';
$('brandNav').value=data.brand.navTitle||'';$('brandHome').value=data.brand.homeTitle||'';$('brandSub').value=data.brand.homeSubtitle||'';$('navLogo').value=data.brand.navLogo||'';$('homeLogo').value=data.brand.homeLogo||'';
Object.entries({navFile:'navLogo',homeFile:'homeLogo'}).forEach(([fid,key])=>$(fid).onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>300000){alert('300KB 이하 이미지를 선택해주세요.');ev.target.value='';return}const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});$(key).value=url;showPreview(key,url)});
$('navLogo').oninput=()=>showPreview('navLogo',$('navLogo').value);$('homeLogo').oninput=()=>showPreview('homeLogo',$('homeLogo').value);showPreview('navLogo',$('navLogo').value);showPreview('homeLogo',$('homeLogo').value);drawCards();}
function showPreview(key,url){const img=$(key==='navLogo'?'navPrev':'homePrev');if(validImage(url)){img.src=url;img.style.display='block'}else img.style.display='none'}
function drawCards(){const root=$('cards');root.replaceChildren();Object.entries(data.games).forEach(([id,g])=>{const box=document.createElement('div');box.className='section';box.innerHTML='<div class="row"><div><label>버튼 제목</label><input data-card="title"></div><div><label>버튼 설명</label><input data-card="subtitle"></div></div><label>버튼 이미지</label><input data-card="image" placeholder="이미지 주소 또는 파일 선택"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif"><img class="preview"><div class="hint" style="margin-top:8px">'+esc(g.title)+' · '+esc(id)+'</div>';box.querySelector('[data-card="title"]').value=g.title||'';box.querySelector('[data-card="subtitle"]').value=g.subtitle||'';box.querySelector('[data-card="image"]').value=g.image||'';const file=box.querySelector('input[type=file]'),url=box.querySelector('[data-card=image]'),prev=box.querySelector('img');const preview=()=>{if(validImage(url.value)){prev.src=url.value;prev.style.display='block'}else prev.style.display='none'};url.oninput=preview;file.onchange=async()=>{const f=file.files[0];if(!f)return;if(f.size>300000){alert('300KB 이하 이미지를 선택해주세요.');file.value='';return}url.value=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});preview()};preview();root.append(box);box.dataset.gameId=id;});}
function drawGame(id){const g=data.games[id],root=$('gameEditor');root.innerHTML='<div class="section-head"><div><h2 style="margin:0">게임 탭 편집</h2><div class="hint">홈 버튼과 상단 탭에 같은 이름으로 표시됩니다.</div></div><button id="deleteGame" class="danger">탭 삭제</button></div><div class="row"><div><label>탭/버튼 제목</label><input id="gameTitle"></div><div><label>버튼 아래 설명</label><input id="gameSub"></div></div><h3>규칙 카드</h3><div id="sections"></div><button id="addSection">＋ 새 규칙 카드 추가</button>';$('gameTitle').value=g.title||'';$('gameSub').value=g.subtitle||'';$('deleteGame').onclick=()=>{if(confirm('이 게임 탭을 삭제할까요?')){delete data.games[id];select('__home')}};g.sections=g.sections||[];drawSections(id);$('addSection').onclick=()=>{g.sections.push({title:'새 규칙',kind:'lines',items:[''],winner:''});drawSections(id)};}
function drawSections(id){const root=$('sections');root.replaceChildren();data.games[id].sections.forEach((s,si)=>{const box=document.createElement('div');box.className='section';box.innerHTML='<div class="section-head"><strong>카드 '+(si+1)+'</strong><button class="danger" aria-label="카드 삭제">× 삭제</button></div><label>카드 제목</label><input class="stitle"><label>표시 방식</label><select class="skind"><option value="lines">게임 방식 (일반 문장)</option><option value="bullets">상세 규칙 (X 표시 목록)</option></select><label>내용 항목</label><div class="items"></div><button class="addItem">＋ 항목 추가</button><label>우승/강조 문구 (선택)</label><textarea class="winner" placeholder="예: 🏆 최후의 1인은 우승"></textarea>';box.querySelector('.stitle').value=s.title||'';box.querySelector('.skind').value=s.kind==='bullets'?'bullets':'lines';box.querySelector('.winner').value=s.winner||'';const items=box.querySelector('.items');(s.items||[]).forEach(v=>addItem(items,v));box.querySelector('.addItem').onclick=()=>addItem(items,'');box.querySelector('.danger').onclick=()=>{data.games[id].sections.splice(si,1);drawSections(id)};root.append(box)});}
function addItem(root,value){const row=document.createElement('div');row.className='item';row.innerHTML='<input aria-label="규칙 항목"><button class="danger" aria-label="항목 삭제">×</button>';row.querySelector('input').value=value||'';row.querySelector('button').onclick=()=>row.remove();root.append(row)}
function collect(){if($('brandNav')){data.brand.navTitle=$('brandNav').value.trim()||'조밈 시참 설명서';data.brand.homeTitle=$('brandHome').value.trim()||data.brand.navTitle;data.brand.homeSubtitle=$('brandSub').value.trim();for(const key of ['navLogo','homeLogo']){const v=$(key).value.trim();if(v&&!validImage(v))throw Error('로고 주소는 https://, ./, / 또는 PNG/JPG/WEBP/GIF 이미지여야 합니다.');data.brand[key]=v}}
document.querySelectorAll('#cards .section').forEach(box=>{const id=box.dataset.gameId,g=data.games[id];if(!g)return;g.title=box.querySelector('[data-card=title]').value.trim()||'새 게임';g.subtitle=box.querySelector('[data-card=subtitle]').value.trim();g.image=box.querySelector('[data-card=image]').value.trim();if(g.image&&!validImage(g.image))throw Error('버튼 이미지 주소 형식을 확인해주세요.')});if(active!=='__home'&&data.games[active]&&$('gameTitle')){const g=data.games[active];g.title=$('gameTitle').value.trim()||'새 게임';g.subtitle=$('gameSub').value.trim();g.sections=Array.from(document.querySelectorAll('#sections .section')).map(box=>({title:box.querySelector('.stitle').value.trim()||'규칙',kind:box.querySelector('.skind').value,items:Array.from(box.querySelectorAll('.items input')).map(i=>i.value.trim()).filter(Boolean),winner:box.querySelector('.winner').value.trim()}))}}
$('loginBtn').onclick=async()=>{const b=$('loginBtn'),s=$('loginStatus');b.disabled=true;s.textContent='Google 로그인 창을 여는 중…';try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){s.textContent=e.code==='auth/popup-closed-by-user'?'로그인이 취소됐습니다.':(e.message||'로그인에 실패했습니다.');s.className='status err'}finally{b.disabled=false}};
auth.onAuthStateChanged(user=>{if(user&&user.email===ADMIN_EMAIL&&user.emailVerified){$('login').classList.add('hidden');$('editor').classList.remove('hidden');$('who').textContent=user.email+' · 관리자';db.ref('site_content').once('value').then(s=>{const v=s.val();if(v&&v.schemaVersion===2){data=v.config||structuredClone(defaults)}ensure();loading=false;drawNav();select('__home')}).catch(e=>status('내용을 불러오지 못했습니다: '+e.message,'err'))}else{$('editor').classList.add('hidden');$('login').classList.remove('hidden')}});
$('logoutBtn').onclick=()=>auth.signOut();$('saveBtn').onclick=async()=>{if(loading)return;try{collect();const b=$('saveBtn');b.disabled=true;status('저장 중…');await db.ref('site_content').set({schemaVersion:2,updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:auth.currentUser.uid,config:data});drawNav();if(active==='__home')drawHome();else drawGame(active);status('저장했습니다. 공개 페이지에서 반영됩니다.','ok')}catch(e){status('저장 실패: '+e.message,'err')}finally{$('saveBtn').disabled=false}};
})();
</script></body></html>
